name: Restore pinned Compliance Trestle submodule reference once
on:
  push:
    paths:
      - '.github/workflows/restore-missing-source-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore exact nist-content Gitlink
        shell: bash
        run: |
          set -euo pipefail
          PIN=0db78b06b7e2372e075d580fe3fc3991c4ec71f7
          git -c protocol.version=2 fetch -q --depth=1 --filter=blob:none https://github.com/oscal-compass/compliance-trestle.git "$PIN"
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          ENTRY="$(git ls-tree FETCH_HEAD -- nist-content)"
          echo "$ENTRY"
          MODE="$(printf '%s' "$ENTRY" | cut -d' ' -f1)"
          SHA="$(printf '%s' "$ENTRY" | awk '{print $3}')"
          test "$MODE" = 160000
          test "${#SHA}" -eq 40
          mkdir -p nist-content .trillionai
          git update-index --add --cacheinfo "160000,$SHA,nist-content"
          test "$(git ls-files -s nist-content | awk '{print $2}')" = "$SHA"
          printf '%s\n' '# Compliance Trestle source repair' '' "Pinned upstream commit: $PIN" "Restored missing original nist-content Gitlink: $SHA" 'This restores the submodule pointer and its identity, not downloaded external submodule contents.' 'Original Apache licence and original source retained. No upstream application code executed.' > .trillionai/SOURCE_COMPLETENESS_REPAIR.md
          rm .github/workflows/restore-missing-source-once.yml
          git add .trillionai/SOURCE_COMPLETENESS_REPAIR.md
          git add -u
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(reference): reinstate original Compliance Trestle nist-content Gitlink'
          git push origin HEAD:main
